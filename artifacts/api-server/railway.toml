[build]
builder = "DOCKERFILE"
dockerfilePath = "artifacts/api-server/Dockerfile"

[deploy]
startCommand = "node --enable-source-maps ./dist/index.mjs http"
healthcheckPath = "/api/healthz"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[[deploy.volumes]]
mountPath = "/vault-cache"
name = "vault-cache"
